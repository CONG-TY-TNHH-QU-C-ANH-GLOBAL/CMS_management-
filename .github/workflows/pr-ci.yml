name: PR CI Gate

# Validation-only gate for PRs and feature branches. Mirrors the pre-deploy
# checks (typecheck → test → build) but NEVER deploys, NEVER uses production
# secrets, and NEVER runs migrations. Production deploy stays solely in
# deploy.yml (push to main). Purpose: block unvalidated PRs before they merge
# to main and trigger the production deploy.

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/**"
      - "feature/**"
      - "chore/**"
      - "ci/**"

# Read-only: no deploy, no secret-backed actions.
permissions:
  contents: read

# Cancel superseded runs for the same PR / branch.
concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke the built Worker in workerd
        # Unit tests run the TypeScript sources under Bun, where Node globals
        # exist. A bundling bug that only breaks the built Worker (2026-10-25:
        # "stream is not defined" on every request after PR #103) passes all of
        # them, so boot dist/ in workerd and hit a route that needs no database.
        run: |
          ./node_modules/.bin/wrangler dev -c dist/server/wrangler.json --ip 127.0.0.1 --port 8787 > /tmp/wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/api/v1/openapi || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "GET /api/v1/openapi -> $code"
          if [ "$code" != "200" ] || grep -qE "ReferenceError|is not defined" /tmp/wrangler-dev.log; then
            echo "::error::Built Worker failed to serve /api/v1/openapi"
            cat /tmp/wrangler-dev.log
            exit 1
          fi

      - name: OpenAPI contract drift
        # In-process schema identity check (no network/secrets). Catches the
        # Phase-D failure mode where a handler's response shape drifts from its
        # declared OpenAPI schema.
        run: bun run check:openapi-drift

      - name: PG content data-plane POC
        # Proves the PostgreSQL content vertical slice against real PostgreSQL in-process
        # (PGlite) — migrations, transactions, constraints, revisions/publications, kind
        # registry, DTO compat, and manifest import. No server, no secrets, no network.
        run: bun run check:pg-content-poc

      - name: PG kind inventory
        # Fails if any production service-block kind (from seeds/manifest) is missing from the
        # code-owned KIND_REGISTRY, or if a seed has an unsupported/unparsable shape. No network.
        run: bun run check:pg-kind-inventory

      - name: Lint (pricing module)
        # Repo-wide `eslint .` has large pre-existing formatting debt, so this
        # gate scopes lint to the actively-maintained pricing surface. Widen to
        # the whole repo after a one-time `prettier --write .` + .gitattributes.
        run: bunx eslint src/features/pricing/ src/routes/admin/sales/pricing/
